aid: battery-smart
name: Battery Smart
description: 'Battery Smart is India''s largest battery-swapping network for electric two-
  and three-wheelers, founded in 2019 by Pulkit Khurana and Siddharth Sikka and operated
  from New Delhi by Upgrid Solutions Private Limited and Upgrid Electrilease Private
  Limited. It runs an asset-light, partner-led model: local businesses — kirana stores,
  petrol pumps and neighbourhood shops — host swap points where a driver exchanges a
  depleted lithium-ion pack for a charged one in roughly two minutes and pays per swap
  instead of buying the battery with the vehicle, which removes the single largest cost
  from an electric two- or three-wheeler. The network is concentrated in Delhi NCR,
  Mumbai, Bengaluru, Hyderabad, Jaipur and Lucknow, and the company has raised across
  eleven rounds including a USD 65 million Series B led by LeapFrog Investments with
  MUFG Bank, Panasonic, Ecosystem Integrity Fund, Blume Ventures and British
  International Investment participating, plus a USD 15 million debt round with Mirova
  in April 2026. Battery Smart''s software ships only as end-user Android applications
  — Battery Smart Driver and Battery Smart Partner — backed by a production API host at
  api.upgrid.in that self-identifies as the "Battery Smart API". As of this profile the
  company publishes no developer portal, API reference, SDK, webhook catalog or
  machine-readable specification of any kind.'
